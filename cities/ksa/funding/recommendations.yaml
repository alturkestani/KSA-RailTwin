  S4-commuter_belt-riyadh-225:
    family: commuter_belt
    recommended_model: fully_public_sar
    judgement: 'analyst''s judgement (rule 9): best fit given the evidence below; not advocacy for any
      entity'
    delivery_note: 'only if the reach objective is chosen (S6-L3): public capital delivery, a stage gate
      before 2047, O&M in-house or contracted.'
    reasoning:
    - 'No model makes the belt self-financing: fares are a few per cent of opex and renewals in the model,
      and its standalone robust NPV is negative.'
    - Private finance adds cost (negative VfM across every registered range) and a demand-risk concession
      has no revenue to carry (P10 BCR far below 1).
    - It is a reach option, bought at a fiscal cost; the decision is about reach, not about delivery.
    conditions: In the model the belt is an island (it touches neither S1 nor another layout corridor,
      R6 flag) and turns Duruma negative next to it (docs/r6-topology.md §0).
