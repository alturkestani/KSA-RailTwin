  S5-station_addition-al-jubayl:
    family: station_addition
    recommended_model: fully_public_sar
    judgement: 'analyst''s judgement (rule 9): best fit given the evidence below; not advocacy for any
      entity'
    delivery_note: capital works let together with, or as a variation of, the host line's works by the
      host line's owner; O&M through the host line's operating arrangement. Who finances (budget, PIF
      or the state rail company) changes reporting, not risk (unclear items fiscal_reporting, pif_role).
    reasoning: &id006
    - 'Small, interface-bound works: each station is an addition to a line someone else builds or runs;
      a standalone station SPV would carry the interface with the host line.'
    - The availability PPP costs the state more in expected PV in every registered parameter range (VfM
      below); the sign changes only at a bid far below the un-uplifted base estimate (switching value
      of A-fund-007).
    - 'Fares do not finance the station: the standalone fare increment is small or negative (the stop
      lengthens through journeys), so a revenue-based model has nothing to carry.'
    conditions: 'Dhahran and Al Jubayl (2030) carry a P10 BCR above 1 in every population case; Duruma
      (2050) does not (stage-gate it at its construction start). Al Jubayl''s and Duruma''s host lines
      are committed, not existing: the delivery route depends on the host line''s procurement (unclear
      item host_line_procurement).'
