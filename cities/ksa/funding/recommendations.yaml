# Label: synthetic demand, uncalibrated: scenario comparison, not a forecast
version: '1.0'
label: 'synthetic demand, uncalibrated: scenario comparison, not a forecast'
units: SAR million, 2025 prices; PV at 2026, Green Book 2026 schedule
population_case: 'un_wpp_low (robust case: the worst of the three, R6 convention); medium and high in
  runs/r7/fiscal/fiscal.json'
judge: v3-variants, SHA-256 d9fef64384e2e25f84b288962907fa25e2476d9749bf863d7bd6fb66fb70f9ee (docs/r6/judge-hashes.md)
international_pilgrim_segment: carries no user benefits (CP6 P8a, CP7-4); it is not added to any fiscal
  or revenue figure
legal_items:
  sar_mandate:
    status: clear
    text: SAR took over the Saudi Railways Organization's responsibilities from 1 Apr 2021; 2016 and 2019
      decisions give it ownership of intercity rail infrastructure and of operational railway projects
      (SAR's own history page).
    sources:
    - S-fund-033
  sar_ownership_form:
    status: unclear
    question: Who are SAR's shareholders per its commercial registration or articles, and what is its
      legal form?
    sources:
    - S-fund-034
    - S-fund-035
  fiscal_reporting:
    status: unclear
    question: Are SAR's capex and debt consolidated in general-government statistics or the budget, and
      would PPP payment commitments or guarantees be disclosed? (fully public via budget, PIF or SAR differ
      in reporting, not in the risk the state carries)
    sources:
    - S-fund-029
    - S-fund-026
  pif_role:
    status: unclear
    question: Does PIF currently finance SAR's capex (equity, loans or guarantees), and what do Arts.
      3-4 of the official PIF Law text say on domestic infrastructure and guarantees?
    sources:
    - S-lb-012
    - S-lb-009
    - S-fund-036
    - S-fund-037
  railway_law_concession:
    status: clear
    text: 'Railway Law M/159: concession contracts are tendered upon TGA approval in accordance with relevant
      laws (Art. 32); TGA may allow a concessionaire to use railway land and protection zones (Art. 33);
      TGA sets the policy for usage fees, the fees charged under use agreements for access to the network
      (Arts. 1 and 18).'
    sources:
    - S-fund-013
    - S-fund-014
    - S-fund-016
  fare_setting_authority:
    status: unclear
    question: Who sets and approves passenger fares on intercity and commuter rail (the state rail company,
      TGA, a ministry or a concession contract)? Railway Law Art. 18 covers usage (access) fees under
      use agreements, not passenger fares; no source read settles it.
    sources:
    - S-fund-016
    - S-fund-012
  railway_law_regulation:
    status: unclear
    question: Which cases of the Railway Law Implementing Regulation allow transfer of existing assets
      to a concessionaire, and has TGA published a usage-fee policy?
    sources:
    - S-fund-054
    - S-fund-055
  psp_law_steps:
    status: clear
    text: 'PSP Law M/63: a PPP is a contract of 5 years or more with two or more of design, build, manage,
      operate, maintain or finance (Art. 1); MoF refers projects to NCP for a preliminary viability study
      within 60 business days (Art. 7); MoF ensures funds and allocations and approves support (Art. 8;
      extra support by Council of Ministers resolution, Art. 10); term up to 30 years unless the relevant
      agency approves longer (Art. 20); termination with compensation that may include lost revenues (Art.
      28); arbitration with the relevant agency''s approval (Art. 34).'
    sources:
    - S-fund-001
    - S-fund-003
    - S-fund-004
    - S-fund-005
    - S-fund-002
    - S-fund-007
    - S-fund-008
  psp_regulations_thresholds:
    status: unclear
    question: What do the amended (2023/2024) Implementing Regulations say on the SAR 200 m PPP threshold
      (reported by secondary sources), procurement methods, the VfM study and MoF fiscal approval?
    sources:
    - S-fund-041
    - S-fund-053
    - S-fund-042
  psp_relevant_agency:
    status: unclear
    question: For an intercity or commuter rail PPP, which body is the relevant and the executive agency
      (Art. 2 governing rules), and is SAR a contracting authority under Art. 4?
    sources:
    - S-fund-010
  psp_railway_interaction:
    status: unclear
    question: Does a rail concession tendered under Railway Law Art. 32 also follow PSP Law procedures
      (NCP study, MoF approval)?
    sources:
    - S-fund-013
    - S-fund-003
  ncp_vfm_method:
    status: unclear
    question: Has NCP published a VfM or PSC method (the R7 test follows the Green Book logic as a named
      reference)?
    sources:
    - S-fund-030
    - S-fund-056
    - S-fund-024
  om_contract_status:
    status: unclear
    question: Is a 5-year-plus O&M-only rail contract (as on Haramain) a PPP under PSP Law Art. 1, with
      NCP and MoF steps, or ordinary government procurement?
    sources:
    - S-fund-001
    - S-fund-039
  host_line_procurement:
    status: unclear
    question: Can a station on a committed host line (GCC Railway in design; the Landbridge in phased
      delivery after the PPP talks ended) be added within the host line's procurement, and under what
      procurement model are the Landbridge phases being let?
    sources:
    - S-029
    - S-059
    - S-lb-001
    - S-060
  lvc_instruments:
    status: unclear
    question: Which Saudi instruments (development rights on railway land under Railway Law Art. 33, municipal
      fees, the white-land fee) could legally be earmarked for rail?
    sources:
    - S-fund-014
  land_expropriation:
    status: unclear
    question: What expropriation procedure and timetable apply to a new rail alignment (not reviewed in
      R1d or R7)?
    sources:
    - S-fund-014
    - S-fund-006
corridors:
  S3-branch_spur-al-kharj:
    family: branch_spur
    recommended_model: fully_public_sar
    judgement: 'analyst''s judgement (rule 9): best fit given the evidence below; not advocacy for any
      entity'
    delivery_note: public capital delivery with an explicit stage gate before construction starts (2047
      for the 2050 phase, A-r6-002), a P90 budget line and contracts that share the cost tail (target
      cost with pain/gain); O&M in-house or by a contracted operator (public_with_private_om has the same
      fiscal exposure in the model).
    reasoning:
    - 'The spur''s value is real in the model (robust NPV positive at P50 cost) but its cost tail is wide:
      at P90 capex the state''s exposure rises under every model, because the overrun at P90 is many times
      any plausible private equity cushion (A-fund-102): risk transfer above the cushion is nominal and
      returns to the state as a contingent liability.'
    - The availability PPP has a negative VfM across every registered range; the financing premium (S-fund-r7-001)
      costs about what the transferred overrun is worth.
    - 'A demand-risk PPP is not a fit: the P10 BCR is below 1 in every population case and fares cover
      well under half of opex and renewals (skill rule). In the model it needs a construction grant larger
      than the contract capex (the grant pre-pays the operating deficit), so its fiscal cost is close
      to public delivery while the ''transferred'' demand risk sits on a revenue stream the minimum revenue
      guarantee then backstops.'
    conditions: 'Carry the P90 cost risk explicitly (CP7-1): the L1 programme turns negative at P90 cost
      in the low and medium population cases. A non-electrified spur narrows that loss but lowers the
      robust NPV (docs/r6-topology.md §0.2); keep it as a design option at the stage gate.'
    alternatives_considered:
    - public_with_private_om
    - ppp_dbfom_availability
    - ppp_dbfom_demand_risk
    - hybrid_public_dbfm_plus_station_lvc
