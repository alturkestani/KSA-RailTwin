# Corridor-family generation rules (corridor-generator skill; R2, 31 Oct 2026).
# Version: corridor_rules.yaml v1.1 | 3 Nov 2026 | Author: screening-analyst (R2; R5 exclude_corridors) | Status: draft
# Every number is {value, range, assumption_id}; each id is a row in docs/assumptions.md (status
# assumed; for Tariq at CP3). Families are generated by screening.corridors from the short list
# (runs/r2/score/scores.parquet), the register and the W1 line layers, never from a town list.
# Label: screening input, not a forecast. Alignments are indicative sketches, not engineering.
label: "screening input, not a forecast; indicative sketch alignments"

network:
  lines_existing: {value: [hhr, sar-north-passenger, sar-east-passenger], source: "A-r1a-008 intercity line set"}
  lines_committed: {value: [landbridge, riyadh-rail-link, gcc-railway-ksa], source: "scenarios/S1.yaml"}
  transfer_km: {value: 10, range: [5, 20], unit: km, assumption_id: A-corr-001}     # stations of two lines this close are one interchange
  on_network_km: {value: 10, unit: km, source: "A-screen-004 served distance (CP1 D10a)"}

trunk_gaps:            # S2
  min_population: {value: 100000, range: [50000, 250000], unit: persons, assumption_id: A-corr-002}
  pair_km: {value: [150, 900], range: [[100, 200], [800, 1000]], unit: km, assumption_id: A-corr-003}  # straight-line band
  pruning: {value: gabriel, alternatives: [relative_neighbourhood, none], assumption_id: A-corr-004}
  detour_max: {value: 1.4, range: [1.25, 1.6], unit: ratio, assumption_id: A-corr-005}   # network km / straight km above this = gap
  speed_gap_tier: {value: 1, assumption_id: A-corr-006}   # pairs of metros of this tier linked only by non-HSR lines -> HSR candidate
  cluster_km: {value: 100, range: [50, 150], unit: km, assumption_id: A-corr-006}  # tier-1 metros this close form one cluster (largest = node)
  speed_gap_pruning: {value: none, alternatives: [gabriel], assumption_id: A-corr-006}  # only 4 tier-1 clusters: every pair in the band
  metro_attach_km: {value: 25, range: [10, 40], unit: km, assumption_id: A-corr-015}  # a metro reaches every station within this

branches_spurs:        # S3
  min_rail_km: {value: 30, range: [20, 50], unit: km, assumption_id: A-corr-007}     # station distance above which a spur is considered
  max_spur_km: {value: 300, range: [200, 400], unit: km, assumption_id: A-corr-008}  # beyond this the town belongs to the trunk family
  group_km: {value: 60, range: [40, 100], unit: km, assumption_id: A-corr-009}       # towns this close that share a root station form one branch
  requires_role: {value: true, source: "corridor-generator skill: 'each short-list town with an economic role'"}

commuter_belts:        # S4
  band_km: {value: [40, 120], unit: km, source: "A-screen-005 commute band (CP1 D10a)"}
  metro_tiers: {value: [1, 2, 3], source: "A-screen-013 metro list (every metro the CP1 list names)"}
  sector_deg: {value: 45, range: [30, 60], unit: degrees, assumption_id: A-corr-010}

station_additions:     # S5
  max_line_km: {value: 15, range: [10, 25], unit: km, assumption_id: A-corr-011}    # town to alignment distance for a new station
  min_station_km: {value: 10, source: "A-screen-004: closer than this is already served"}

geometry:
  sketch: {value: great_circle_polyline, assumption_id: A-corr-012}
  route_factor: {value: 1.2, range: [1.1, 1.4], unit: ratio, assumption_id: A-corr-012}  # for costing only; length_km is the sketch length
  terrain_sample_km: {value: 5, unit: km, assumption_id: A-corr-013}
  terrain_search_km: {value: 30, range: [15, 50], unit: km, assumption_id: A-corr-013}   # nearest classified register row within this
  structures_by_terrain:   # share of route km in tunnel / viaduct by terrain class, A-corr-014 (assumed, to replace with W3 cost-register evidence)
    flat_desert: {tunnel: 0.0, viaduct: 0.02}
    coastal: {tunnel: 0.0, viaduct: 0.05}
    dunes: {tunnel: 0.0, viaduct: 0.03}
    sabkha: {tunnel: 0.0, viaduct: 0.10}
    mixed: {tunnel: 0.03, viaduct: 0.05}
    escarpment_mountain: {tunnel: 0.15, viaduct: 0.10}
    unknown: {tunnel: 0.02, viaduct: 0.04}
  structures_assumption_id: A-corr-014

# R5 (CP5 decision H4a, Tariq, 3 Nov 2026): explicit exclusions. screening.corridors generate drops a
# listed id and records it as a decision row of its family (S<n>.yaml dominated_or_merged); validate
# rejects a corridor file with a listed id. `members` guards the premise: if the id is ever generated
# from other short-list rows, generation stops for review. A decision, not an assumption.
exclude_corridors:
  - id: S4-commuter_belt-jazan-225
    members: ["jazan:node:1013176773"]   # Farasan (register row), the only member when H4a was taken
    reason: "sea crossing to Farasan (38.2 km of open sea in the R4_ALIGN route, docs/alignments.md section 5), not a rail corridor"
    decision: "H4a, Tariq, 3 Nov 2026 (docs/STATUS.md CP5 decisions)"
