# > **Document version:** cities/ksa/assumptions/demand_calibration.yaml v0.1 | 31 Oct 2026 | Author: demand-modeler (R3) | Status: draft
# Observed annual totals for the W8 gravity + mode-choice calibration (skill gravity-calibration), with
# evidence grades and tolerances. Grades: A = primary official table read by the builder; B = official
# figure relayed by press/secondary with the URL captured; C = press without a primary; D = unverified.
# Only usable A/B targets are calibrated to; C/D are listed as "available but unverified".
# Sources: docs/sources/r3-cal.csv (S-r3-cal-0xx) and docs/sources/index.csv. Assumptions:
# docs/assumptions.md (A-demand-0xx). Generated from the manifest files
# gastat-rail-tables-2025-en and gastat-air-tables-2025-en (values copied by script, not by hand).
version: '0.1'
label: 'synthetic demand, uncalibrated: scenario comparison, not a forecast'
base_year:
  value: 2025
  range:
  - 2024
  - 2025
  assumption: A-demand-040
  status: assumed
  note: latest year with grade A rail and air tables; 2024 runs as a check (population base 2024 = 35,300,280, S-cp2-gastat-006)
pass_rule:
  rule: a target passes when |modelled/observed - 1| <= tolerance.rel; GEH is reported, never used as the pass test
  assumption: A-demand-036
  geh:
    formula: sqrt(2 (M - C)^2 / (M + C))
    basis: average daily flows (annual / 365)
    source: S-r3-cal-030
    note: TAG M3.1 defines GEH on hourly link flows (GEH < 5 in > 85% of cases); here it is a descriptive statistic only
  only_usable: 'targets with usable: true and evidence_grade A or B; C/D targets are ''available but unverified'' and never calibrated to (gravity-calibration skill)'
tolerances:
  A_total:
    rel: 0.15
    assumption: A-demand-032
    source: S-r3-cal-031
    note: 'TAG M3.2 Table 4: assigned vs observed < 15% across screenline/boarding/alighting groups'
  A_station:
    rel: 0.25
    assumption: A-demand-033
    source: S-r3-cal-031
    low_flow_exempt_below_departures_per_year: 100000
    note: 'TAG M3.2 Table 5: individual stops/stations < 25%; trip ends below 100,000 departures a year are reported, not failed (A-demand-033)'
  A_tld:
    rel: 0.05
    assumption: A-demand-034
    source: S-r3-cal-030
    note: 'TAG M3.1 Table 5: trip length distribution means within 5% (a matrix-estimation limit, used by analogy)'
  B:
    rel: 0.25
    assumption: A-demand-035
    note: secondary relay of an official figure; wider than grade A
  C: null
  D: null
