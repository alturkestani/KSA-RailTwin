  fare_sar_per_km_hsr: {value: 0.405, low: 0.356, high: 0.558, unit: "SAR per track-km, economy, one way", price_year: 2025, currency: SAR, assumption_id: A-cba-120, sources: [S-soc-318, S-r1a-012, S-r4-rt-002], note: "derived: HHR Jeddah-Madinah from SAR 150 / 370.3 km = 0.405 (S-soc-318, secondary; km as in A-mode-037); low = assumed Makkah-Madinah SAR 160 (A-mode-041) / 449.2 km = 0.356; high = Makkah-Jeddah SAR 43 (S-r1a-012, secondary) / 77 km (S-r4-rt-002, secondary) = 0.558. Fares sampled 2025-2026, taken as 2025 prices. A transfer in the social CBA; enters FIRR and user generalised cost"}
