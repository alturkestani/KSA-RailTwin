  opex_share_year1: {value: 1.0, low: 0.85, high: 1.0, unit: "share of steady-state opex in the first year", price_year: 2025, currency: SAR, assumption_id: A-cba-125, sources: [], note: "assumption: the operator runs the full timetable from opening while demand ramps (costs do not ramp); low allows a thinner opening timetable"}
