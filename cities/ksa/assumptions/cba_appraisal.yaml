# label: synthetic demand, uncalibrated: scenario comparison, not a forecast
# Appraisal parameters for economics/ (W4). Price base SAR, 2025 prices (A-cost-001); peg 3.75 SAR/USD (S-lb-020).
# Sources: docs/sources/r5-cba-a.csv (S-r5-cba-*) and docs/sources/index.csv; register rows: logs/r5/assumptions-cba-a.md (A-cba-101..126).
# Behavioural coefficients here are literature-based until survey results exist (rule 1).
#
# Value-of-time derivation (A-cba-010 income transfer; method choice A-cba-106, pending Tariq's approval):
#   V_UK,2025 = V_TAG,2023 x (UK GDP deflator 2025/2023 = 121.9856/113.1838 = 1.07777, S-cost-idx-002)
#               x (UK real GDP per capita 2025/2023 = 48422.07/47911.15 = 1.01066)^1.0 (S-r5-cba-001; Data Book default elasticity 1, S-cp1-093)
#             = V_TAG,2023 x 1.08926
#   central (PPP route): V_KSA = V_UK,2025 / 0.677133 (UK PPP factor 2025) x (73783.56/64606.50 = 1.14205)^e x 1.755302 (KSA PPP factor 2025)
#             (S-r5-cba-002, S-cp1-097, S-cp1-098); e = 1.0 central; SAR per GBP at e = 0 is 2.5923 on this route
#   high (market-exchange route, the A-mode-006 method): V_UK,2025 x 3.75 / 0.759474 (= 4.9376 SAR/GBP 2025, S-cost-idx-003) x 1.14205^1.015
#   low (non-work): World Bank TRN-15 fallback 0.3 x income per hour (S-cp1-096): GASTAT HIES 2018 income of individuals with income
#             SAR 6,346/month (S-r5-cba-010) x CPI 137.2119/120.9409 (S-r5-cba-003) = SAR 7,199.8/month / 173.33 h (40 h x 52 / 12) = 41.54 SAR/h x 0.3
#             = 12.46 SAR/h (per income earner, so it overstates the per-head TRN-15 basis); low (work, commute): PPP route with e = 0.5 (S-cp1-095)
# The mode-choice design VoT (A-mode-006, 37.7 SAR/h non-work, 2023 prices) uses the market-exchange route, i.e. close to the high end
# here; behavioural and appraisal values therefore differ by about 1.6-1.9x until A-cba-106 is decided (departures table, logs/r5/standards.md).
params:
  vot_commute: {value: 50.02, low: 46.81, high: 95.47, unit: "SAR per person-hour", price_year: 2025, currency: SAR, assumption_id: A-cba-101, sources: [S-cp1-092, S-cost-idx-002, S-r5-cba-001, S-r5-cba-002, S-cp1-097, S-cp1-098, S-cost-idx-003, S-cp1-095], note: "TAG commuting 15.5126 GBP/h (2023) x 1.08926 = 16.897 GBP/h (2025); central PPP route 16.897 / 0.677133 x 1.14205^1.0 x 1.755302 = 50.02; low e = 0.5: 46.81; high market route 16.897 x 4.9376 x 1.14205^1.015 = 95.47. Perceived = market price in TAG for non-work time. literature-based until survey results exist"}
  vot_business: {value: 93.58, low: 76.15, high: 184.82, unit: "SAR per person-hour (market price)", price_year: 2025, currency: SAR, assumption_id: A-cba-102, sources: [S-cp1-092, S-r5-cba-007, S-cost-idx-002, S-r5-cba-001, S-r5-cba-002, S-cp1-097, S-cp1-098, S-cost-idx-003, S-r5-cba-022], note: "TAG working person average factor cost 25.2347 GBP/h (2023) x 1.08926 = 27.487; PPP route x 1.14205 = 81.37 SAR/h factor cost; market price = x (1 + KSA indirect tax rate 0.15, A-cba-124) = 93.58 (TAG's own market price uses the UK factor 1.19, S-r5-cba-007); low = factor cost, e = 0.5, no tax correction: 76.15; high = TAG market price 30.0293 x 1.08926 x 4.9376 x 1.14205^1.015 = 184.82. TAG distance-banded rail business value 200km+ is 63.46 GBP/h market (2.1x the average, S-r5-cba-007): not applied (A-cba-010 uses the average); sensitivity only. Cost-savings approach (employer pays); literature-based until survey results exist"}
  vot_leisure_vfr: {value: 22.83, low: 12.46, high: 43.58, unit: "SAR per person-hour", price_year: 2025, currency: SAR, assumption_id: A-cba-103, sources: [S-cp1-092, S-cost-idx-002, S-r5-cba-001, S-r5-cba-002, S-cp1-097, S-cp1-098, S-cost-idx-003, S-cp1-096, S-r5-cba-010, S-r5-cba-003], note: "TAG other non-work 7.0804 GBP/h (2023) x 1.08926 = 7.712; central PPP route = 22.83; low = TRN-15 fallback 12.46 (PPP e = 0.5 gives 21.37); high market route = 43.58. literature-based until survey results exist"}
  vot_tourism: {value: 22.83, low: 12.46, high: 43.58, unit: "SAR per person-hour", price_year: 2025, currency: SAR, assumption_id: A-cba-104, sources: [S-cp1-092, S-r5-cba-002, S-cp1-096, S-r5-cba-010], note: "same as vot_leisure_vfr (A-mode-021 gives tourism the non-work value; no Saudi tourism VoT found). Foreign tourists' VoT reflects origin incomes, not KSA incomes: not segmented in R5. literature-based until survey results exist"}
  vot_pilgrimage: {value: 22.83, low: 12.46, high: 43.58, unit: "SAR per person-hour", price_year: 2025, currency: SAR, assumption_id: A-cba-105, sources: [S-cp1-092, S-r5-cba-002, S-cp1-096, S-r5-cba-010], note: "same as vot_leisure_vfr (A-mode-021: no Saudi or Umrah VoT found, S-soc-308). International pilgrims' incomes differ widely from KSA incomes: not segmented; flagged in the distributional note. literature-based until survey results exist"}
  vot_income_elasticity: {value: 1.0, low: 0.5, high: 1.015, unit: "elasticity of VoT to real GDP per capita (over time and cross-section)", price_year: 2025, currency: SAR, assumption_id: A-cba-107, sources: [S-cp1-093, S-cp1-090, S-cp1-095, S-cp1-094], note: "TAG Data Book 'Default Pars' = 1 (S-cp1-093); TAG A1.3 para 4.5.1 = 1.015 (S-cp1-090); World Bank TRN-15 0.5-0.8 (S-cp1-095). The Data Book notice uplifts VoT by a flat 1.5 % a year (S-cp1-094): not used; R5 uses growth x elasticity. VoT(t) = VoT(2025) x (1 + g)^(e x (t - 2025))"}
  real_gdp_per_capita_growth: {value: 1.47, low: 0.75, high: 2.57, unit: "% per year, real, KSA", price_year: 2025, currency: SAR, assumption_id: A-cba-108, sources: [S-r5-cba-005, S-r5-cba-006, S-r5-cba-001], note: "derived: IMF WEO Oct 2026 real GDP growth / population growth, per capita 2029-2031 geometric mean = 1.47 % (2026 -5.20, 2027 +5.78, 2028 +2.75, 2029 +1.37, 2030 +1.47, 2031 +1.57); low = realised 2015-2025 WDI constant-2015-US$ GDP per capita 23,256 -> 25,066 = 0.75 % a year; high = IMF 2027-2031 mean 2.57 % (includes the 2027 rebound). Held flat after 2031 (assumption). Drives VoT and GDP-per-worker growth"}
  reliability_ratio: {value: 0.4, low: 0.3, high: 0.8, unit: "value of 1 min SD of car journey time / value of 1 min of time", price_year: 2025, currency: SAR, assumption_id: A-cba-109, sources: [S-r5-cba-008], note: "TAG A1.3 para 6.3.4 = 0.4 (car, all purposes; UK 2015 SP study). Range assumed: no KSA reliability valuation found. Central case does NOT monetise car reliability (see rail_reliability_sd_share)"}
