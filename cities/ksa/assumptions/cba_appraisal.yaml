  rail_reliability_ratio: {value: 1.4, low: 1.0, high: 1.8, unit: "value of SD of lateness / value of average lateness (PT)", price_year: 2025, currency: SAR, assumption_id: A-cba-111, sources: [S-r5-cba-009], note: "TAG A1.3 para 6.5.3 = 1.4; range assumed; sensitivity only"}
  rail_reliability_sd_share: {value: 0.10, low: 0.05, high: 0.20, unit: "SD of car journey time / mean journey time, intercity roads", price_year: 2025, currency: SAR, assumption_id: A-cba-112, sources: [], note: "assumption: no KSA intercity journey-time variability data found (TrafficTwin covers Jeddah urban only; TAG A1.3 para 6.3.2 formula is for UK urban roads, S-r5-cba-008). NOT USABLE in the central case: reliability benefit = 0 in the central case, this parameter and A-cba-109 run as a sensitivity only"}
