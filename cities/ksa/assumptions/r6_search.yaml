# R6 search settings (optimise.search). Every value is a registered assumption (docs/assumptions.md (A-r6-*)).
# Label: synthetic demand, uncalibrated: scenario comparison, not a forecast.
capex_ceilings_sar_m:
  # P50 uplifted capex of the layout (SAR m, 2025 prices, undiscounted), hard constraint (R6 design B).
  # Anchored on the S1 committed programme's own P50 uplifted capex, 101,508 SAR m (sum of
  # runs/costs/S1-{landbridge,riyadh-rail-link,gcc-railway-ksa}/rcf/summary.yaml): about 1x, 2.5x and 5x it.
  # The full 71-corridor set is 1,330,379 SAR m on the same basis (line runs; station additions at line cost here).
  B1: {value: 100000, assumption: A-r6-003, note: "about one more committed-scale programme"}
  B2: {value: 250000, assumption: A-r6-003, note: "about 2.5x the committed programme"}
  B3: {value: 500000, assumption: A-r6-003, note: "about 5x the committed programme; ~38 % of the full corridor set"}
ga:
  pop_size: {value: 80, assumption: A-r6-013}
  generations_per_restart: {value: 100, assumption: A-r6-013}
  mutation_per_gene: {value: "1.5 / n corridors", assumption: A-r6-013}
  seeds: {value: [1, 2, 3, 4, 5], assumption: A-r6-013}
  stop_after_restarts_without_front_change: {value: 2, source: "prompts/R6.md guardrail D"}
agent_loop:
  stop_after_consecutive_non_improving: {value: 20, source: "prompts/R6.md guardrail D"}
overfitting:
  holdout: {value: "high population case and P90 cost", source: "prompts/R6.md guardrail D"}
  rank_drop_flag: {value: 5, unit: places, source: "prompts/R6.md guardrail D"}
