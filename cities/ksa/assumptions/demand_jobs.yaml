# > **Document version:** cities/ksa/assumptions/demand_jobs.yaml v0.1 | 31 Oct 2026 | Author: demand-modeler (R3) | Status: draft
# Jobs proxy per region (and the rule to distribute it to governorate zones) for the W8 gravity model.
# Source file: manifest kapsarc-gastat-labour-admin-records (GASTAT administrative records relayed by the
# KAPSARC Data Portal; values copied by script). Region slugs match cities/ksa/regions/*.csv.
# Sources: docs/sources/r3-cal.csv; assumptions: docs/assumptions.md.
version: '0.1'
label: 'synthetic demand, uncalibrated: scenario comparison, not a forecast'
jobs_proxy:
  definition: formal workplace jobs = GOSI participants on the job (private sector, social-insurance rules) + civil-service employees, by administrative region, 2025
    Q4
  source: S-r3-cal-050
  status: secondary
  evidence_grade: B
  assumption: A-demand-003
  excludes:
    note: domestic workers (not published by region), military and security personnel, the self-employed outside GOSI, informal work; 579 civil-service records 'undefined'
      and 380 'out of the kingdom' are dropped
    assumption: A-demand-004
  caveat: Riyadh holds 49.2% of formal jobs against 26.7% of the 2022 population. Part of this is real (the capital), part may be registration at head-office region;
    the dataset does not say which region basis it uses. Run the population-share sensitivity below.
  national_total_jobs_formal: 14836997
  check: 'region sums equal the published totals: GOSI 13,665,115 (Total row); civil service 1,171,882 of 1,172,841 (959 undefined/abroad)'
