sensitivity:
  population_share:
    rule: jobs_r = national_total_jobs_formal x share_population_2022_r
    assumption: A-demand-003
    population_source: S-cp2-gastat-001 (Census 2022 by region, relayed by DataPulse; manifest gastat-popregion-relayed-datapulse-csv); recompute from S-cp2-gastat-007
      (governorate primary export) through the zone-region join for the final run
  blend:
    rule: jobs_r = 0.5 x admin-record jobs + 0.5 x population-share jobs
    assumption: A-demand-003
regional_residence_based_alternative:
  status: not available
  source: S-r3-cal-051
  note: GASTAT LFS employed-by-region shares on the KAPSARC portal end at 2021 Q2; the GASTAT LFS Q4 2025 workbook with employed by region was not obtained
governorate_distribution:
  rule: jobs_g = jobs_r(g) x pop2022_g / pop2022_r(g), with pop2022_g from GASTAT Census 2022 TA1 governorate primary export and r(g) from the zone's region attribute
    (zones.geojson, OSM containment)
  source: S-cp2-gastat-007
  assumption: A-demand-002
  status: assumed (proxy)
  flag: 'proxy: assumes jobs per resident is uniform within a region; overstates jobs in dormitory governorates, understates industrial cities'
  sensitivity: replace pop2022_g by an OSM activity weight w_g = area of landuse in (commercial, retail, industrial) + 0.01 km2 x count of amenity/shop/office POIs,
    normalised within the region (ODbL); plus the economic nodes (industrial cities, ports, mining, energy; cities/ksa/zones/economic_nodes.csv) as special generators
    for business attraction only
used_for:
  commute: attraction D_j
  business: attraction D_j (with population)
  leisure_vfr: not used (population)
  tourism: not used (tourism nodes + population)
  pilgrimage: not used (fixed destinations)
