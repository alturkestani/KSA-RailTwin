# > **Document version:** cities/ksa/assumptions/cba_wei.yaml v0.1 | 3 Nov 2026 | Author: economist (R5) | Status: draft
# label: synthetic demand, uncalibrated: scenario comparison, not a forecast
# Wider economic impacts (WEI) parameters, DfT TAG A2.4 (cover November 2025; gov.uk updated 29 May 2025, corrected 11 Dec 2025) and
# TAG A2.1 (May 2026). Reported SEPARATELY: BCR without WEIs and BCR with WEIs (cba-appraisal skill; no double counting).
# Method (TAG A2.4 Equations 1-4): mode GTC averaged over business + commuting trips only (leisure excluded, S-r5-cba-015);
# ATEM_i = sum_j E_j x GTC_ij^(-alpha) (power decay per Graham, Gibbons and Martin 2009; the equation is an image in the PDF, form to
# confirm against the Wider Impacts Dataset); WI_i = |(ATEM_A / ATEM_B)^rho - 1| x GDP per worker x E_i (sign kept in code).
# Static clustering only (fixed land use); no dynamic clustering, no move to more/less productive jobs, no dependent development.
# Price base SAR, 2025 prices (A-cost-001). Sources: docs/sources/r5-cba-a.csv; register rows: logs/r5/assumptions-cba-a.md (A-cba-130..142).
params:
  agglomeration_elasticity: {value: 0.043, low: 0.021, high: 0.083, unit: "elasticity of productivity w.r.t. ATEM", price_year: 2025, currency: SAR, assumption_id: A-cba-130, sources: [S-r5-cba-011, S-r5-cba-012], note: "TAG A2.4 Table 2 economy-wide weighted average 0.043 (S-r5-cba-011), used because no KSA employment-by-sector-by-region table was found (A-cba-141); low = manufacturing 0.021, high = producer services 0.083 (Table C1, S-r5-cba-012). UK estimates transferred without adjustment (departure); TAG E.1.31 notes elasticities vary by city size. Public-sector agglomeration only in an indicative variant (TAG para 5.1.13)"}
  agglomeration_decay_alpha: {value: 1.655, low: 1.097, high: 1.818, unit: "distance-decay exponent on generalised cost", price_year: 2025, currency: SAR, assumption_id: A-cba-131, sources: [S-r5-cba-011, S-r5-cba-012, S-r5-cba-013], note: "TAG A2.4 Table 2 economy-wide 1.655; low = manufacturing 1.097, high = consumer services 1.818 (Table C1). TAG para 5.1.2: inter-city schemes must also test the highest decay value (1.818), which reduces long-distance effects"}
  agglomeration_decay_alpha_business_intercity: {value: 1.782, low: 1.746, high: 1.818, unit: "distance-decay exponent, business purpose, inter-city test", price_year: 2025, currency: SAR, assumption_id: A-cba-132, sources: [S-r5-cba-013, S-r5-cba-012], note: "TAG para 5.1.3: business travel on inter-city schemes tested with the average of consumer (1.818) and producer services (1.746) decay = 1.782 (derived); sensitivity run, not central"}
  effective_density_cutoff_km: {value: 0, low: 0, high: 0, unit: "km (0 = no cut-off)", price_year: 2025, currency: SAR, assumption_id: A-cba-133, sources: [S-r5-cba-011], note: "TAG A2.4 sets no distance cut-off: the decay term does the work (Equation 2 sums over all destination areas). R5 follows it: no km cut-off. The minute-based sensitivity is effective_density_cutoff_min"}
  effective_density_cutoff_min: {value: 0, low: 0, high: 200, unit: "generalised minutes (0 = no cut-off)", price_year: 2025, currency: SAR, assumption_id: A-cba-134, sources: [S-bench-de-025], note: "sensitivity only: Ahlfeldt and Feddersen (Cologne-Frankfurt) find spillovers halve every 30 min and fall to about 1 % after about 200 min (S-bench-de-025); the high variant drops pairs beyond 200 min to test how much of the WEI comes from very long trips"}
  gdp_per_worker_sar: {value: 263106, low: 157864, high: 322743, unit: "SAR per worker per year", price_year: 2025, currency: SAR, assumption_id: A-cba-135, sources: [S-r5-cba-004, S-soc-338, S-r3-cal-050], note: "derived: GDP 2025 SAR 4,788,536 m (WDI, S-r5-cba-004) / 18.2 m employed (GASTAT LMS Q2 2025 via Argaam, S-soc-338, secondary) = 263,106; high = / 14,836,997 formal jobs (GOSI + civil service 2025 Q4, S-r3-cal-050) = 322,743; low = central x 0.6, ASSUMING about 40 % of GDP is hydrocarbon value added that does not respond to agglomeration (oil / non-oil current-price split not found in this pass; to source from GASTAT national accounts). National average only: no regional GDP published (S-r1a-528)"}
  gdp_per_worker_growth: {value: 1.47, low: 0.75, high: 2.57, unit: "% per year, real", price_year: 2025, currency: SAR, assumption_id: A-cba-136, sources: [S-r5-cba-015, S-r5-cba-005, S-r5-cba-006, S-r5-cba-001], note: "TAG A2.4 para 4.3.2: productivity impacts grow with real GDP per capita after the last modelled year; same values as real_gdp_per_capita_growth (A-cba-108, cba_appraisal.yaml)"}
  agglomeration_ramp_year1: {value: 0.5, low: 0.5, high: 1.0, unit: "share of full agglomeration benefit in opening year", price_year: 2025, currency: SAR, assumption_id: A-cba-137, sources: [S-r5-cba-014], note: "TAG A2.4 para 4.2.2: 0.5 in year 1 rising linearly to 1.0 in year 11; high 1.0 = no ramp (sensitivity). Applied on top of demand ramp-up only through the GTC/trip inputs, not twice"}
  agglomeration_ramp_years: {value: 10, low: 10, high: 10, unit: "years to full benefit", price_year: 2025, currency: SAR, assumption_id: A-cba-138, sources: [S-r5-cba-014], note: "TAG A2.4 para 4.2.2"}
  imperfect_competition_uplift: {value: 0.134, low: 0.10, high: 0.134, unit: "share of business user benefits (incl. reliability)", price_year: 2025, currency: SAR, assumption_id: A-cba-139, sources: [S-r5-cba-016, S-r5-cba-017], note: "TAG A2.1 (May 2026) Table 4: 13.4 % of business user benefits (S-r5-cba-016); low = the previous TAG 10 % (S-r5-cba-017). UK market-structure estimate transferred (departure); no KSA evidence. Counted in the 'with WEIs' BCR only"}
  labour_supply_uplift: {value: 0, low: 0, high: 0, unit: "share of GDP change (welfare)", price_year: 2025, currency: SAR, assumption_id: A-cba-140, sources: [S-r5-cba-016], note: "NOT MODELLED. TAG A2.1 Table 4 values labour supply at 40 % of the GDP change, i.e. the UK tax wedge (S-r5-cba-016); the KSA tax wedge on labour income and a Saudi labour-supply elasticity were not sourced in this pass, and the women's-participation evidence (docs/social.md, S-soc-001, S-soc-011) is qualitative for appraisal. Reported qualitatively"}
  employment_national_total: {value: 14836997, low: 14836997, high: 18200000, unit: "jobs (workplace-based), 2025", price_year: 2025, currency: SAR, assumption_id: A-cba-141, sources: [S-r3-cal-050, S-soc-338], note: "pointer: employment by region for E_j comes from cities/ksa/assumptions/demand_jobs.yaml (formal jobs = GOSI + civil service by region, 2025 Q4, S-r3-cal-050; distributed to governorate zones by the demand rule); high = LFS employed 18.2 m (S-soc-338, secondary). No employment-by-sector-by-region table found (S-r1a-524 regional LFS tables not found; S-soc-015 gives participation rates only), so a single economy-wide elasticity is used"}
  public_sector_agglomeration_included: {value: 0, low: 0, high: 1, unit: "switch (0 = excluded from central, 1 = indicative variant)", price_year: 2025, currency: SAR, assumption_id: A-cba-142, sources: [S-r5-cba-011], note: "TAG A2.4 paras 5.1.11-5.1.13: public-sector agglomeration only in the indicative BCR, valued with the economy-wide elasticity, welfare only (not GDP)"}
