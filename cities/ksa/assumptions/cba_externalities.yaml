# Document version: cities/ksa/assumptions/cba_externalities.yaml v0.2 | 3 Nov 2026 | Author: economist (R5, CBA-B) | Status: draft
# W4 externality and resource-cost parameters. Base: SAR 2025 prices (A-cost-001); peg 3.75 SAR/USD (S-lb-020).
# Price conversion: cities/ksa/costs/index.yaml factors I-gbp-2023-sar-2025 = 5.321609, I-eur-2016-sar-2025 = 5.406486,
# I-usd-2017-sar-2025 = 4.835307 (A-cost-002). Income transfer (A-cba-223): x (KSA/UK GDP pc PPP 2025)^1 = 1.142 for
# DfT TAG willingness-to-pay values; x (KSA/EU GDP pc PPP 2025)^1 = 1.1264 for EU Handbook values. Resource costs
# (vehicle operating costs) and carbon values are NOT income-transferred.
# Every behavioural or valuation figure here is literature-based until survey results exist. Outputs that use these values
# are "synthetic demand, uncalibrated: scenario comparison, not a forecast".
# Schema: params.<key> = {value, low, high, unit, price_year, currency, assumption_id, sources, note}; the two schedule
# nodes (carbon_value_schedule, ksa_grid_kgco2e_per_kwh_schedule) carry year keys {<year>: {value, low, high}} directly.
meta:
  label: "synthetic demand, uncalibrated: scenario comparison, not a forecast"
  price_year: 2025
  currency: SAR
  income_transfer: {uk_to_ksa: 1.142, eu_to_ksa: 1.1264, elasticity: 1.0, assumption_id: A-cba-223, sources: [S-cp1-097, S-cp1-098, S-r5-cba-217, S-cp1-093]}
  demand_model_car_cost_finding: >-
    grep of modechoice/ and cities/ksa/assumptions/mode_choice*.yaml: the generalised cost includes FUEL ONLY.
    modechoice/pairs.py lines 139-172: cost_sar_car = km * fuel_price_sar_per_l / fuel_economy_km_per_l + parking, per
    vehicle, divided by occupancy in the MNL; mode_choice_r3.yaml car.running_cost_basis = fuel_only (A-mode-023;
    2.18 SAR/L S-soc-316, 10 km/L S-soc-317), occupancy 2.0 (A-mode-022). Non-fuel VOC (wear, maintenance, depreciation)
    is not in the perceived cost. CBA rule: user benefits already carry the fuel saving for diverted car trips through
    the rule of half; add only the non-fuel resource saving (car_voc_nonfuel_sar_per_vkm) as a separate VOC line, never
    the full car_vehicle_operating_cost_sar_per_vkm on top of the user benefit.
params:
  car_occupancy_intercity:
    {value: 2.0, low: 1.61, high: 2.5, unit: persons per car (per vehicle-km), price_year: 2025, currency: SAR, assumption_id: A-cba-201, sources: [S-r5-cba-202], note: "central = A-mode-022 (2.0, the demand model's value; kept identical so car-VKM removed matches the trips the MNL diverts). No KSA occupancy survey found. Low = TAG Data Book v2.03 Table A1.3.3 average car, all-week, per vehicle-km 1.614 (UK 2010); high = assumption (KSA intercity family, VFR and pilgrimage trips; TAG 'other' purpose weekend is 2.09). literature-based until survey results exist"}
  bus_occupancy_intercity:
    {value: 25.0, low: 12.8, high: 40.0, unit: passengers per bus (per vehicle-km), price_year: 2025, currency: SAR, assumption_id: A-cba-202, sources: [S-r5-cba-202, S-r5-cba-219], note: "assumption. No KSA bus-km found: GASTAT reports 43.5 million bus passengers within and between cities in 2022 (S-r5-cba-219) but no vehicle-km. Low = TAG A1.3.3 PSV passengers 12.8 (UK local buses, S-r5-cba-202); central 25 ~ half of a 49-seat coach; high 40 ~ 80 % of a 49-seat coach (assumption)"}
  road_crash_cost_sar_per_car_vkm:
    {value: 0.1475, low: 0.0724, high: 0.4385, unit: SAR per car vehicle-km (average total casualty cost), price_year: 2025, currency: SAR, assumption_id: A-cba-203, sources: [S-r5-cba-219, S-r5-cba-215, S-r5-cba-218, S-r5-cba-206, S-r5-cba-221, S-r5-cba-216, S-soc-317, S-r5-cba-220, S-r5-cba-222, S-r5-cba-201], note: "derivation (central): VSL = 70 x KSA GDP per capita 2025 USD 34,536.66 (S-r5-cba-215) = USD 2,417,566 = SAR 9,065,872 (iRAP rule of thumb 70, range 60-80, S-r5-cba-218). Deaths 4,555 and injuries 24,400 (GASTAT 2022, S-r5-cba-219). Injury value as a share of VSL from TAG Table A4.1.1 (S-r5-cba-206): serious 0.1112, slight 0.0085; serious share of reported injuries 0.5 (assumption; GASTAT gives no split). Total = 4,555 x 9.066M + 24,400 x (0.5 x 0.1112 + 0.5 x 0.0085) x 9.066M = SAR 54.5 bn. Share attributable to car traffic 0.8 (assumption; trucks, buses, motorcycles). VKM proxy (no KSA vehicle-km statistic found): gasoline 838 L per person 2024 (S-r5-cba-221, secondary) x population 35,300,280 (S-r5-cba-216) = 29.58 bn L (= 186.1 M bbl; press reports 188.2 M bbl) x 10 km/L (S-soc-317) = 295.8 bn vkm. 54.5 x 0.8 / 295.8 = 0.1475. Low: VSL 60x, serious share 0.3, car share 0.7, 14 km/L (414.1 bn vkm) = 0.0724. High: EU Handbook 2019 car external accident cost 7.2 EUR-cent/vkm (S-r5-cba-222) x 5.406 x 1.126 = 0.4385; the KSA derivation with VSL 80x, WHO-estimated 6,651 deaths (2021, S-r5-cba-220, secondary), all injuries serious, share 0.9, 8 km/L gives 0.369. Reported injuries (5.4 per death) look under-reported against EU ratios, so the central is likely low. Damage-only crash and admin costs excluded. Cross-check: TAG A5.4.2 rural A-road accident MEC 1.16 p/vkm (external part only, UK risk) = 0.0705 (S-r5-cba-201)"}
  road_crash_cost_sar_per_bus_vkm:
    {value: 0.3872, low: 0.1901, high: 1.1511, unit: SAR per bus vehicle-km, price_year: 2025, currency: SAR, assumption_id: A-cba-224, sources: [S-r5-cba-222], note: "no KSA bus-involvement statistics found. EU Handbook 2019 Table 8 bus/coach 18.9 vs passenger car 7.2 EUR-cent/vkm, ratio 2.625 (S-r5-cba-222). Central = 2.625 x KSA car central 0.1475 (A-cba-203) = 0.387; low = 2.625 x 0.0724 = 0.190; high = Handbook bus/coach 18.9 EUR-cent x 5.406486 x 1.1264 = 1.151"}
  rail_crash_cost_sar_per_train_km:
    {value: 3.1789, low: 1.0536, high: 4.7684, unit: SAR per train-km (external accident cost), price_year: 2025, currency: SAR, assumption_id: A-cba-204, sources: [S-r5-cba-222], note: "EU Handbook 2019 Table 8, EU28 2016 averages: conventional passenger train 52.2 EUR-cent/vkm, high-speed 17.3 EUR-cent/vkm (S-r5-cba-222). x 5.406486 (EUR 2016 -> SAR 2025) x 1.1264 (income transfer) = conventional 3.18, HSR 1.05. Central = conventional; low = HSR value; high = 1.5 x conventional (assumption: level crossings and camel/sand incursion risk on desert lines; no KSA rail casualty statistics found). Small relative to road values; use rail_crash_cost_sar_per_train_km_hsr for HSR lines"}
  rail_crash_cost_sar_per_train_km_hsr:
    {value: 1.0536, low: 0.5268, high: 3.1789, unit: SAR per train-km, price_year: 2025, currency: SAR, assumption_id: A-cba-204, sources: [S-r5-cba-222], note: "EU Handbook 2019 Table 8 high-speed passenger train 17.3 EUR-cent/vkm, transferred as above. Low = 0.5x (assumption); high = conventional value"}
  carbon_value_sar_per_tco2e_2025:
    {value: 1858.9, low: 929.4, high: 2788.3, unit: SAR per tCO2e, price_year: 2025, currency: SAR, assumption_id: A-cba-205, sources: [S-r5-cba-204, S-r5-cba-205], note: "CENTRAL CHOICE: UK DESNZ/BEIS carbon values for policy appraisal (Sep 2021 edition, GBP 2020 prices: 2025 low/central/high 130/260/390; the edition in force on 3 Nov 2026, no newer edition found, S-r5-cba-205), as carried in DfT TAG Data Book v2.03 (May 2026) Table A3.4.1 in 2023 prices, market price unit of account: 2025 = GBP 349.30 (low 174.65, high 523.96) (S-r5-cba-204). x 5.321609 (I-gbp-2023-sar-2025) = SAR 1,858.9. Not income-transferred: a target-consistent value for a global damage. Chosen as central because it is a published appraisal schedule to 2050+ with low/high bands and matches the TAG framework already used for VoT (A-cba-010); the World Bank/HLCCP range (carbon_value_hlccp_2030_sar_per_tco2e) is much lower and runs as a sensitivity. Departure: UK market-price unit (UK indirect tax 19 %) kept rather than re-based to KSA VAT 15 %"}
  carbon_value_2025:
    {value: 1858.9, low: 929.4, high: 2788.3, unit: SAR per tCO2e, price_year: 2025, currency: SAR, assumption_id: A-cba-205, sources: [S-r5-cba-204, S-r5-cba-205], note: "alias of carbon_value_sar_per_tco2e_2025 under the key economics/cba.py and economics/montecarlo.py read; keep the two identical"}
  carbon_value_growth_real:
    {value: 0.0151, low: 0.0151, high: 0.0151, unit: fraction per year (real), price_year: 2025, currency: SAR, assumption_id: A-cba-206, sources: [S-r5-cba-204], note: "derived from TAG A3.4.1 central: (508.53 / 349.30)^(1/25) - 1 = 1.514 %/yr for 2025-2050; TAG extends post-2050 at 1.5 %/yr (2055 = 547.84). Prefer carbon_value_schedule (exact path); the growth rate is a scalar fallback"}
  carbon_value_schedule:
    unit: SAR per tCO2e
    price_year: 2025
    currency: SAR
    assumption_id: A-cba-206
    sources: [S-r5-cba-204, S-r5-cba-205]
    note: "TAG A3.4.1 market-price values (GBP 2023) x 5.321609; low = 0.5 x central, high = 1.5 x central (the DESNZ low/high bands); interpolate linearly between listed years; 2060-2100 are TAG's own extension (market price 2060 GBP 590.17 ... 2100 GBP 1,070.59, ~1.5 %/yr); np.interp holds 2100 flat beyond 2100. Year keys sit directly under this node (economics/cba.py carbon_value reads digit keys)"
    2025: {value: 1858.9, low: 929.4, high: 2788.3}
    2030: {value: 2004.8, low: 1002.4, high: 3007.2}
    2035: {value: 2162.1, low: 1081.1, high: 3243.2}
