# Document version: cities/ksa/costs/index.yaml v1.1 | 31 Oct 2026 | Author: cost-estimator (R1c, costs.index_build); P2a single index by CP2_PREP | Status: draft
# The only price and currency index (cost register and W5 benchmarks; CP2 P2a); generated, do not edit by hand.
base:
  currency: SAR
  price_year: 2025
  assumption_id: A-cost-001
method_central: inflate_then_convert
method_sensitivity: convert_then_inflate
method_assumption_id: A-cost-002
method_rule: 'CP2 P2a (Tariq, 31 Oct 2026): the only price index. SAR items: Saudi
  CPI. Foreign-currency items: the source economy''s GDP deflator (World Bank WDI)
  before conversion, then the 2025 rate to USD and the peg 3.75 to SAR. Exceptions
  A-cost-307: EUR with no euro-area economy -> Eurostat EA20 deflator; AED -> UAE
  CPI (no 2025 WDI deflator); TWD and other currencies not listed -> no factor (not
  converted).'
peg_sar_per_usd:
  value: 3.75
  source: S-lb-020
series_exceptions_assumption_id: A-cost-307
