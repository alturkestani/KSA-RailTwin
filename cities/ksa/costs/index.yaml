  series are manifest rows wb-fp-cpi-totl-2026-10, wb-ny-gdp-defl-zs-2026-10, wb-pa-nus-fcrf-2026-10,
  eurostat-nama10gdp-ea20-pd15-2026-10 and (folded in from the former R1b index) wb-wdi-ny-gdp-defl-zs-2026-10-08,
