# Document version: cities/ksa/costs/cost_register.yaml v1.0 | 31 Oct 2026 | Author: cost-estimator (R1c) | Status: draft
# W3 cost register (cost-register skill; schema common.schemas.CostItem). Cost ranges, not a budget.
# Values are in the SOURCE currency and price year (the `SAR` token in `unit` names the base currency; normalise
# with `uv run python -m costs.register normalise --to SAR --price-year 2025`). Sources: docs/sources/cost-*.csv
# and docs/sources/index.csv; assumptions: docs/assumptions.md; summary and reconciliation: docs/costs.md.
# Rows with low = central = high are single published figures (see notes), never modelled points; every estimate
# draws them through the reference-class uplift (cities/ksa/costs/uplifts.yaml).
