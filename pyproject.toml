[project]
name = "ksa-railtwin"
version = "0.0.1"
description = "KSA Rail Twin: open-source, national economic feasibility study of a Saudi rail network (simulation is the tool, the decision case is the product)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "duckdb>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "geopandas>=1.0",
    "networkx>=3.3",
    "typer>=0.12",
    "rich>=13",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "httpx>=0.28",
    "rasterio>=1.5.2",
    "openpyxl>=3.1.5",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "ruff>=0.5",
    "pytest>=8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web", "data", ".worktrees"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # typer.Option defaults are the idiomatic typer CLI style

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
