# film/storyboard/shots.yaml v1.4 | 10 Nov 2026 | Author: R10 builder (v1.4: FIX_FILM_STORY, plain-language captions, benefit-to-cost bars, north/south shots sh-08-15..20 from S6-L6; v1.3: BUILD_MOVIE: full-sentence captions, sim_map for every main shot; v1.2: FIX_HALF2_QUALITY, single closing notice, sim_map trailer shots; v1.1: FIX_CP8_NOTES); motion-graphics (R10) | Status: draft (CP9)
# One shot per script line or run of consecutive lines; checked by:
#   uv run python -m film.shots check film/storyboard/shots.yaml --lines film/script/lines.csv
# duration_s = sum of the covered lines' English est_seconds (lines.csv); the Arabic cut re-times to its own VO in half 2.
# footer (FIX_HALF2_QUALITY, Tariq 8 Nov 2026): synthetic on each cut's LAST shot only (the single closing notice
#   'synthetic demand, uncalibrated: scenario comparison, not a forecast' / glossary term 4); none everywhere else.
# reuse_of / held_frame_from: a shot showing another shot's picture inherits its OSM credit and Copernicus
#   extra_credit (chart re-cuts of a data panel inherit neither).
# renderer sim_map (every shot of both cuts since BUILD_MOVIE): film/sim.py (moving map over the DEM relief, the twin's GeoJSON, trains, charts); spec under `sim:`.
# quote_label: {en, ar}: quotation styling per language; true only where every covered line of that language is a quote.
# storyboard.md section 2 is generated: uv run python -m film.shots storyboard film/storyboard/shots.yaml --write
