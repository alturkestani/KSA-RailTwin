# Station-site research for the 14 unlocated stops (CP2_PREP item 6, rail-data-scout, 31 Oct 2026).
# Applied with `uv run python -m rail.lines apply-sites`; sources in docs/sources/index.csv (S-cp2-6xx),
# bands A-stn-001…009 in docs/assumptions.md. Committed stops stay committed (announced/planned).
counts:
  resolved: 1
  low_confidence: 11
  unlocated: 2
rules:
  outcome_meaning: resolved = published or OSM-tagged facility site; low_confidence = town/facility-name
    only, centroid + band; unlocated = nothing located, no point placed
  uncertainty: A-stn-001 (built-up radius, geo-verify extents), A-stn-002 (fallback 15 km), A-stn-003
    (max of own radius and alternative candidates), A-stn-004/005 (facility offsets)
  layers: committed stays committed (announced/planned); no layer upgraded
  coordinates: WGS84; distances are geodesics (pyproj via screening.geo_verify.geom)
  google_maps: not used
